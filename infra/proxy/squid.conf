# Casa Playa → Piraeus Paycenter ticketing proxy.
#
# The only reason this machine exists: the Paycenter ticketing web service may
# only be called from an IP declared in advance to Euronet (Redirection manual
# §3, §4), and Vercel has no fixed egress IP. The application tunnels that one
# SOAP call through here, so Euronet always sees 46.224.113.245.
#
# Everything else is closed on purpose: no plaintext port, no second upstream,
# no caching, no anonymous use.

# ── Listener ──────────────────────────────────────────────────────────
# A TLS-wrapped forward proxy: the CONNECT request and the credentials are
# themselves inside TLS, never on the wire in clear. The certificate is
# self-signed and pinned in the application (undici ProxyAgent, proxyTls.ca),
# so there is no CA, no DNS name, and nothing that ever expires in practice.
https_port 8443 tls-cert=/etc/squid/tls/proxy.crt tls-key=/etc/squid/tls/proxy.key tls-options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1

# ── Authentication ────────────────────────────────────────────────────
# A shared secret rather than an IP allow-list: Vercel's egress addresses are
# not fixed, which is the very reason this proxy exists.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 4 startup=1 idle=1
auth_param basic realm casa-playa
auth_param basic credentialsttl 1 hour
acl authenticated proxy_auth REQUIRED

# ── The single permitted destination ──────────────────────────────────
acl paycenter      dstdomain paycenter.piraeusbank.gr
acl paycenter_port port 443
acl CONNECT        method CONNECT

# Order matters. The destination is checked before authentication, so someone
# who finds the port cannot even provoke a 407 for anything but the one host we
# allow. Negation is used only on ordinary ACLs — a negated proxy_auth ACL is
# documented as unreliable, hence the positive `allow authenticated` below.
http_access deny !CONNECT
http_access deny !paycenter
http_access deny !paycenter_port
http_access allow authenticated
http_access deny all

# Nothing may be reached by any other route, including Squid's own manager.
http_access deny all
icp_access deny all
htcp_access deny all

# ── No caching ────────────────────────────────────────────────────────
# Every request here is an opaque TLS tunnel; there is nothing cacheable.
cache deny all
cache_mem 8 MB
maximum_object_size 0 KB

# ── Say as little as possible ─────────────────────────────────────────
via off
forwarded_for delete
httpd_suppress_version_string on

# ── Logs ──────────────────────────────────────────────────────────────
# One line per payment attempt, all to the same host. This is what we have to
# hand when Euronet asks about a specific transaction.
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 14

connect_timeout 30 seconds
read_timeout 2 minutes
shutdown_lifetime 5 seconds

coredump_dir /var/spool/squid
